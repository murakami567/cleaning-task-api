name: Add room CI CO fees
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-room-ci-co-fees.yml']
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch source
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('app/routers/rooms_management.py')
          s=p.read_text()
          s=s.replace('    note: str | None = Body(None),\n    current_user: dict = Depends(require_admin_write),\n):', '    note: str | None = Body(None),\n    early_checkin_fee: int | None = Body(0),\n    late_checkout_fee: int | None = Body(0),\n    current_user: dict = Depends(require_admin_write),\n):', 1)
          s=s.replace('        "note": _text(note),\n    }', '        "note": _text(note),\n        "early_checkin_fee": _int_or_default(early_checkin_fee, 0),\n        "late_checkout_fee": _int_or_default(late_checkout_fee, 0),\n    }', 1)
          marker='    note: str | None = Body(None),\n    current_user: dict = Depends(require_admin_write),\n):'
          idx=s.find(marker, s.find('@router.post("/rooms/update")'))
          if idx >= 0:
              s=s[:idx]+s[idx:].replace(marker, '    note: str | None = Body(None),\n    early_checkin_fee: int | None = Body(None),\n    late_checkout_fee: int | None = Body(None),\n    current_user: dict = Depends(require_admin_write),\n):', 1)
          s=s.replace('    if note is not None:\n        payload["note"] = _text(note)\n\n    if not room_id:', '    if note is not None:\n        payload["note"] = _text(note)\n    if early_checkin_fee is not None:\n        payload["early_checkin_fee"] = max(_int_or_default(early_checkin_fee, 0), 0)\n    if late_checkout_fee is not None:\n        payload["late_checkout_fee"] = max(_int_or_default(late_checkout_fee, 0), 0)\n\n    if not room_id:', 1)
          p.write_text(s)

          p=Path('app/routers/employee_tasks_override.py')
          s=p.read_text()
          old='''    cleaning_tasks = [map_cleaning_task(row, "cleaning") for row in (cleaning_res.data or [])]\n    check_tasks = [map_cleaning_task(row, "check") for row in ((check_res.data if check_res else []) or [])]\n    other_tasks = [map_other_task(row) for row in (other_res.data or [])]'''
          new='''    # 部屋マスタのアーリーCI / レイトCO料金をタスク表示へ反映する。\n    fee_map: dict[tuple[str, str], dict[str, int]] = {}\n    try:\n        properties_res = supabase.table("properties").select("id,property_name").execute()\n        property_names = {str(row.get("id")): str(row.get("property_name") or "") for row in (properties_res.data or [])}\n        rooms_res = supabase.table("rooms").select("property_id,room_name,early_checkin_fee,late_checkout_fee").execute()\n        for room in rooms_res.data or []:\n            property_name = property_names.get(str(room.get("property_id")), "")\n            room_name = str(room.get("room_name") or "")\n            if property_name and room_name:\n                fee_map[(property_name, room_name)] = {\n                    "early_checkin_fee": int(room.get("early_checkin_fee") or 0),\n                    "late_checkout_fee": int(room.get("late_checkout_fee") or 0),\n                }\n    except Exception as e:\n        logger.warning(f"room fee lookup failed: {e}")\n\n    cleaning_tasks = [map_cleaning_task(row, "cleaning", fee_map) for row in (cleaning_res.data or [])]\n    check_tasks = [map_cleaning_task(row, "check", fee_map) for row in ((check_res.data if check_res else []) or [])]\n    other_tasks = [map_other_task(row) for row in (other_res.data or [])]'''
          if old not in s: raise SystemExit('employee task mapping marker not found')
          s=s.replace(old,new,1)
          s=s.replace('def map_cleaning_task(row: dict[str, Any], task_kind: str):', 'def map_cleaning_task(row: dict[str, Any], task_kind: str, fee_map: dict[tuple[str, str], dict[str, int]] | None = None):', 1)
          s=s.replace('    checklist = row.get("checklist")', '    room_fees = (fee_map or {}).get((property_name, room_name), {})\n\n    checklist = row.get("checklist")', 1)
          s=s.replace('        "rateCi": row.get("early_checkin_fee") or "",\n        "rateCo": row.get("late_checkout_fee") or "",', '        "rateCi": room_fees.get("early_checkin_fee", 0),\n        "rateCo": room_fees.get("late_checkout_fee", 0),', 1)
          p.write_text(s)

          m=Path('supabase/migrations/20260906_add_room_ci_co_fees.sql')
          m.parent.mkdir(parents=True, exist_ok=True)
          m.write_text('''alter table public.rooms\n  add column if not exists early_checkin_fee integer not null default 0,\n  add column if not exists late_checkout_fee integer not null default 0;\n\nalter table public.rooms\n  add constraint rooms_early_checkin_fee_nonnegative check (early_checkin_fee >= 0),\n  add constraint rooms_late_checkout_fee_nonnegative check (late_checkout_fee >= 0);\n''')
          PY
      - name: Validate Python
        run: python -m compileall -q app
      - name: Commit source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/routers/rooms_management.py app/routers/employee_tasks_override.py supabase/migrations/20260906_add_room_ci_co_fees.sql
          git commit -m 'feat: 部屋別アーリーCI・レイトCO料金を追加'
          git push
      - name: Remove workflow
        run: |
          git pull --rebase
          git rm .github/workflows/add-room-ci-co-fees.yml
          git commit -m 'chore: remove room fee migration workflow'
          git push
