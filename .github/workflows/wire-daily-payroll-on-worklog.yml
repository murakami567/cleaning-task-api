name: Wire daily payroll on worklog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-daily-payroll-on-worklog.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update employee worklog endpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/routers/employee.py')
          s = p.read_text()

          import_marker = 'from app.services.auth_service import get_current_user_id, require_admin_or_leader\n'
          import_line = 'from app.services.payroll_daily_service import recalculate_piece_daily_payroll\n'
          if import_line not in s:
              if import_marker not in s:
                  raise SystemExit('auth import marker not found')
              s = s.replace(import_marker, import_marker + import_line, 1)

          old = '''    if not res.data:\n        raise HTTPException(status_code=500, detail="実働登録に失敗しました。")\n\n    logger.info(f"create_worklog: user_id={user_id} date={insert_data.get('work_date')}")\n    return {"message": "実働を登録しました。", "data": res.data[0]}\n'''
          new = '''    if not res.data:\n        raise HTTPException(status_code=500, detail="実働登録に失敗しました。")\n\n    payroll_sync = None\n    try:\n        if insert_data.get("work_date"):\n            payroll_sync = recalculate_piece_daily_payroll(\n                user_id, str(insert_data.get("work_date"))\n            )\n    except Exception as e:\n        # 実働自体は保存済みなので、給与同期エラーで同じ実働を再POSTさせない。\n        logger.error(\n            f"create_worklog payroll sync failed: user_id={user_id} "\n            f"date={insert_data.get('work_date')} {e}",\n            exc_info=True,\n        )\n        payroll_sync = {"ok": False, "error": "daily_payroll_sync_failed"}\n\n    logger.info(f"create_worklog: user_id={user_id} date={insert_data.get('work_date')}")\n    return {\n        "message": "実働を登録しました。",\n        "data": res.data[0],\n        "payroll_sync": payroll_sync,\n    }\n'''
          if old not in s:
              raise SystemExit('create_worklog return marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Compile Python
        run: python -m compileall -q app
      - name: Commit changes and remove workflow
        run: |
          rm .github/workflows/wire-daily-payroll-on-worklog.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routers/employee.py app/services/payroll_daily_service.py .github/workflows/wire-daily-payroll-on-worklog.yml
          git commit -m "feat: 実働報告時に部屋単価給与を日次反映"
          git push
