name: Add cleaning task CI CO time fields
on:
  push:
    paths:
      - '.github/workflows/add-task-ci-co-times.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update task API
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/routers/tasks.py')
          s = p.read_text()
          old = '''    assignment_locked: bool | None = Body(None),\n):\n'''
          new = '''    assignment_locked: bool | None = Body(None),\n    early_checkin_time: str | None = Body(None),\n    late_checkout_time: str | None = Body(None),\n):\n'''
          if old not in s:
              raise SystemExit('tasks.py signature anchor not found')
          s = s.replace(old, new, 1)
          old = '''    if assignment_locked is not None:\n        payload["assignment_locked"] = assignment_locked\n\n    if not payload:\n'''
          new = '''    if assignment_locked is not None:\n        payload["assignment_locked"] = assignment_locked\n\n    if early_checkin_time is not None:\n        payload["early_checkin_time"] = early_checkin_time or None\n\n    if late_checkout_time is not None:\n        payload["late_checkout_time"] = late_checkout_time or None\n\n    if not payload:\n'''
          if old not in s:
              raise SystemExit('tasks.py payload anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('app/routers/employee_tasks_override.py')
          s = p.read_text()
          old = '''        "rateCi": room_fees.get("early_checkin_fee", 0),\n        "rateCo": room_fees.get("late_checkout_fee", 0),\n        "towelCount": calc_towel_display(property_name, next_guest_count, next_stay_nights),\n'''
          new = '''        "rateCi": room_fees.get("early_checkin_fee", 0),\n        "rateCo": room_fees.get("late_checkout_fee", 0),\n        "earlyCheckinTime": row.get("early_checkin_time") or "",\n        "lateCheckoutTime": row.get("late_checkout_time") or "",\n        "towelCount": calc_towel_display(property_name, next_guest_count, next_stay_nights),\n'''
          if old not in s:
              raise SystemExit('employee task map anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Compile
        run: python -m py_compile app/routers/tasks.py app/routers/employee_tasks_override.py
      - name: Add SQL migration reference
        run: |
          mkdir -p sql
          cat > sql/add_cleaning_task_ci_co_times.sql <<'SQL'
          alter table public.cleaning_tasks
          add column if not exists early_checkin_time time null,
          add column if not exists late_checkout_time time null;
          SQL
      - name: Commit changes and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/add-task-ci-co-times.yml
          git add app/routers/tasks.py app/routers/employee_tasks_override.py sql/add_cleaning_task_ci_co_times.sql .github/workflows/add-task-ci-co-times.yml
          git commit -m 'feat: 清掃タスクにアーリーCI・レイトCO時刻を追加'
          git push
