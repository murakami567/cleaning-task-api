name: Expose task CI CO times
on:
  push:
    paths:
      - '.github/workflows/expose-task-ci-co-times.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch employee task API
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/routers/employee_tasks_override.py')
          s = p.read_text()
          old = '''        "checkerName": row.get("checker_name") or "",
        "rateCi": room_fees.get("early_checkin_fee", 0),
        "rateCo": room_fees.get("late_checkout_fee", 0),
        "towelCount": calc_towel_display(property_name, next_guest_count, next_stay_nights),
'''
          new = '''        "checkerName": row.get("checker_name") or "",
        "earlyCheckinTime": row.get("early_checkin_time") or "",
        "lateCheckoutTime": row.get("late_checkout_time") or "",
        "rateCi": room_fees.get("early_checkin_fee", 0),
        "rateCo": room_fees.get("late_checkout_fee", 0),
        "towelCount": calc_towel_display(property_name, next_guest_count, next_stay_nights),
'''
          if old not in s:
              raise SystemExit('target snippet not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Compile
        run: python -m py_compile app/routers/employee_tasks_override.py
      - name: Commit changes and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routers/employee_tasks_override.py
          git commit -m "feat: 従業員タスクAPIにアーリーCI・レイトCO時刻を追加"
          git rm .github/workflows/expose-task-ci-co-times.yml
          git commit -m "chore: remove temporary migration workflow"
          git push
